<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>My tasks</h1>
      <p id="summary" class="summary" aria-live="polite"></p>
    </header>

    <!-- Add-task form. A real <form> lets Enter submit the task natively. -->
    <form id="task-form" class="task-form" autocomplete="off">
      <label for="task-input" class="visually-hidden">New task</label>
      <input id="task-input" type="text" placeholder="What needs doing?" maxlength="200" />
      <button type="submit" class="btn-add">Add</button>
    </form>

    <!-- The list is rebuilt from the tasks array by script.js -->
    <ul id="task-list" class="task-list"></ul>

    <!-- Shown only when there are no tasks -->
    <p id="empty-state" class="empty-state" hidden>
      Nothing here yet. Add your first task above.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
